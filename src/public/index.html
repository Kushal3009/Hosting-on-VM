<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Master | Node.js + Express + PostgreSQL + Sequelize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-glow top-left"></div>
  <div class="background-glow bottom-right"></div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo-icon">⚡</div>
        <div>
          <h1>Postgres & Sequelize CRUD</h1>
          <p class="subtitle">Node.js • Express • PostgreSQL (Docker) • Sequelize ORM</p>
        </div>
      </div>
      <div class="header-badges">
        <span class="tech-badge pg-badge">
          <span class="status-dot"></span> PostgreSQL: Active
        </span>
        <a href="/api/items" target="_blank" class="api-link">View JSON API ↗</a>
      </div>
    </header>

    <!-- Main Grid -->
    <main class="main-layout">
      <!-- Left Column: Create Form -->
      <section class="card form-card">
        <h2 class="card-title">
          <span class="icon">➕</span> Create New Item
        </h2>
        <form id="createForm">
          <div class="form-group">
            <label for="createTitle">Title <span class="required">*</span></label>
            <input type="text" id="createTitle" placeholder="e.g. Set up database replication" required>
          </div>

          <div class="form-group">
            <label for="createCategory">Category</label>
            <input type="text" id="createCategory" placeholder="e.g. DevOps, Feature, Bug" value="General">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="createStatus">Status</label>
              <select id="createStatus">
                <option value="pending" selected>Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <div class="form-group">
              <label for="createPriority">Priority</label>
              <select id="createPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="createDescription">Description</label>
            <textarea id="createDescription" rows="3" placeholder="Enter details or notes..."></textarea>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary">
            <span>Create Item</span>
          </button>
        </form>
      </section>

      <!-- Right Column: Item List & Controls -->
      <section class="card list-card">
        <div class="list-header">
          <div>
            <h2 class="card-title">
              <span class="icon">📋</span> Items Collection 
              <span id="itemsCount" class="counter">0</span>
            </h2>
          </div>
          <div class="controls-bar">
            <div class="search-box">
              <input type="text" id="searchInput" placeholder="Search title or description...">
            </div>
            <div class="filter-box">
              <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <button id="refreshBtn" class="btn btn-secondary icon-btn" title="Refresh">
              🔄
            </button>
          </div>
        </div>

        <div id="itemsContainer" class="items-list">
          <!-- Dynamic Items Rendered Here -->
          <div class="empty-state">
            <p>Loading items from PostgreSQL database...</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-backdrop hidden">
      <div class="modal card">
        <div class="modal-header">
          <h3>Edit Item</h3>
          <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <form id="editForm">
          <input type="hidden" id="editId">
          <div class="form-group">
            <label for="editTitle">Title <span class="required">*</span></label>
            <input type="text" id="editTitle" required>
          </div>

          <div class="form-group">
            <label for="editCategory">Category</label>
            <input type="text" id="editCategory">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="editStatus">Status</label>
              <select id="editStatus">
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <div class="form-group">
              <label for="editPriority">Priority</label>
              <select id="editPriority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="editDescription">Description</label>
            <textarea id="editDescription" rows="3"></textarea>
          </div>

          <div class="modal-actions">
            <button type="button" id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
